<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Grimlock</title>
<link rel="stylesheet" href="ui.css">
</head>
<body>

<div class="app">

    <!-- ================= Sidebar ================= -->
<aside id="sidebar" class="collapsed">
    <div class="sidebar-header">
        <div class="logo">
            <img src="assets/images/logo-1.png" alt="Logo">
        </div>
        <span class="sidebar-title">Project Grimlock</span>
        <button id="sidebarToggle">
            <img src="assets/icons/iconName=sidebar.png" alt="Toggle">
        </button>
    </div>

    <div class="sidebar-content">
        <button class="menu-btn" id="btn-new-chat">
            <span class="icon"><img src="assets/icons/iconName=newChat.png"></span>
            <span class="label">New Chat</span>
        </button>

        <button class="menu-btn" id="btn-history">
            <span class="icon"><img src="assets/icons/iconName=conversations.png"></span>
            <span class="label">History</span>
        </button>

        <button class="menu-btn" id="btn-apps">
            <span class="icon"><img src="assets/icons/iconName=apps.png"></span>
            <span class="label">Debug</span>
        </button>

        <button class="menu-btn" id="btn-settings">
            <span class="icon"><img src="assets/icons/iconName=settings.png"></span>
            <span class="label">Settings</span>
        </button>
    </div>
</aside>

    <!-- ================= Main Area ================= -->
<div class="main-area">
    <header>
        <div class="header-buttons">
            <button class="menu-btn" id="btn-upload">
                <span class="icon"><img src="assets/icons/iconName=upload.png" alt="Share"></span>
                <span>Share</span>
            </button>
            <button class="menu-btn" id="btn-more">
                <span class="icon"><img src="assets/icons/iconName=more.png" alt="Share"></span>
                <span>Share</span>
            </button>
        </div>
    </header>

    <main id="chatBox">
        <div id="chat"></div>
    </main>

    <div class="input-area">
        <button class="attach-btn"><img src="assets/icons/iconName=plus.png" alt="+"></button>
        <input type="text" id="userInput" placeholder="Type your message..." />
        <button class="mic-btn"><img src="assets/icons/iconName=mic.png" alt="Mic"></button>
        <button class="send-btn"><img src="assets/icons/iconName=arrowUp.png" alt="Send"></button>
    </div>
</div>

</div>

<script src="ui.js"></script>
</body>
</html>
