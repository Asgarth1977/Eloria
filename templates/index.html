<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT Clone</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <aside id="sidebar">
        <div class="sidebar-header">
            <!-- Logo doubles as toggle when collapsed -->
            <div class="logo" id="sidebarLogo">🧠</div>
            <button id="sidebarToggle"><img src="{{ url_for('static', filename='icons/iconName=sidebar.png') }}" alt="Attach"></img></button>
        </div>
        <div class="sidebar-content">
            <button class="menu-btn"><span class="icon">🏠</span><span class="label">Home</span></button>
            <button class="menu-btn"><span class="icon">💬</span><span class="label">Chats</span></button>
            <button class="menu-btn"><span class="icon">📜</span><span class="label">History</span></button>
            <button class="menu-btn"><span class="icon">🐞</span><span class="label">Debug</span></button>
            <button class="menu-btn"><span class="icon">⚙️</span><span class="label">Settings</span></button>
        </div>
    </aside>

    <div class="main-area">
        <header>
            <span class="app-title">ChatGPT Clone</span>
            <div class="header-buttons">
                <button>GPT-4</button>
                <button>Get Plus</button>
                <button>Share</button>
                <button>⋯</button>
            </div>
        </header>

        <main id="chatBox">
            <div class="message-area" id="messageArea"></div>
        </main>

        <div class="input-area">
            <button class="attach-btn"><img src="{{ url_for('static', filename='icons/iconName=plus.png') }}" alt="Attach"></img></button>
            <input type="text" id="userInput" placeholder="Type your message..." />
            <button class="send-btn"><img src="{{ url_for('static', filename='icons/iconName=arrowUp.png') }}" alt="Send"></button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
