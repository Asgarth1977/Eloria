<!-- Index.html file -->

<!DOCTYPE html>
<html>
<head>
    <title>Eloria AI Assistant</title>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
<script src="{{ url_for('static', filename='js/emoji.js') }}"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>

<!-- Startup Splash -->
<div id="startupSplash">
    <div id="splashContent">
        <div id="startupText"> Booting Eloria... </div>
        <div id="progressContainer">
            <div id="loadingProgress"></div>
        </div>
    </div>
    <!-- Animated background dots -->
    <canvas id="splashCanvas"></canvas>
</div>


    <div id="chat"></div>
    <div id="emoji-container">
        <button id="emoji-left">⬅️</button>
        <div id="emoji-picker">
            {% for emoji in emojis %}
                <button class="emoji-btn" data-code="{{emoji.split('.')[0]}}">
                <img src="/emojis/{{emoji}}">
                </button>
            {% endfor %}
        </div>
        <button id="emoji-right">➡️</button>
    </div>

    <!-- Input area -->
    <input type="file" id="attach-input" style="display:none;" accept=".json">
    <div id="input-area">
        <button id="attach-btn" title="Attach memory file">
            <img src="{{ url_for('static', filename='icons/plus_2795.png') }}" alt="+">
        </button>
        <div id="input" contenteditable="true" placeholder="Type a message..."></div>
        <button id="send">Send</button>
    </div>

    <script>
        const chat = document.getElementById('chat');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('send');
        const emojiPicker = document.getElementById('emoji-picker');
        const emojiLeft = document.getElementById('emoji-left');
        const emojiRight = document.getElementById('emoji-right');

        function addMessage(text, sender, timestamp){
    // Replace emoji placeholders with actual images
    const emojiRegex = /:([a-z0-9_-]+):/g;
    text = text.replace(emojiRegex, (match, name) => {
        return `<img src="/emojis/${name}.png" class="inline-emoji">`;
    });
            const div = document.createElement('div');
            div.className = 'bubble ' + sender;
            div.innerHTML = text;
            const ts = document.createElement('div');
            ts.className = 'timestamp';
            ts.textContent = timestamp;
            div.appendChild(ts);
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function getInputText() {
    // Clone input so we don't alter the DOM
    const clone = input.cloneNode(true);
    // Replace each emoji img with its placeholder code
    clone.querySelectorAll('img.inline-emoji').forEach(img => {
        const name = img.src.split('/').pop().split('.')[0];
        const placeholder = `:${name}:`;
        const textNode = document.createTextNode(placeholder);
        img.replaceWith(textNode);
    });
    return clone.innerText;
}

        async function sendMessage(){
            const text = getInputText().trim();
            if(!text) return;
            const now = new Date().toLocaleTimeString();
            addMessage(text, 'user', now);
            input.innerHTML = '';
            const res = await fetch('/chat', {
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body: JSON.stringify({text})
            });
            const data = await res.json();
            addMessage(data.response, 'ai', new Date().toLocaleTimeString());
        }

        sendBtn.onclick = sendMessage;
        input.addEventListener('keypress', e => { if(e.key==='Enter') sendMessage(); });

        emojiLeft.onclick = () => { emojiPicker.scrollBy({ left:-100, behavior:'smooth' }); };
        emojiRight.onclick = () => { emojiPicker.scrollBy({ left:100, behavior:'smooth' }); };

document.querySelectorAll('.emoji-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        const imgSrc = btn.querySelector('img').src;
        if (!imgSrc) return;

        // Focus the input div
        input.focus();

        // Create emoji image element
        const emojiImg = document.createElement('img');
        emojiImg.src = imgSrc;
        emojiImg.className = 'inline-emoji';

        const sel = window.getSelection();
        let range;
        if (sel.rangeCount > 0) {
            range = sel.getRangeAt(0);
        } else {
            // If nothing selected, create a new range at end
            range = document.createRange();
            range.selectNodeContents(input);
            range.collapse(false);
            sel.removeAllRanges();
            sel.addRange(range);
        }

        // Insert the emoji at the cursor
        range.deleteContents();
        range.insertNode(emojiImg);

        // Move cursor right after emoji
        range.setStartAfter(emojiImg);
        range.collapse(true);
        sel.removeAllRanges();
        sel.addRange(range);
    });
});


// Load existing conversation (outside the emoji loop)
const conversation = {{ conversation|tojson }};
for(const msg of conversation){
    const sender = msg.role==='user'?'user':'ai';
    addMessage(msg.content, sender, new Date(msg.timestamp).toLocaleTimeString());
}

                

    </script>

    <!-- Menu Button -->
<button id="menuToggle" class="menu-btn">☰</button>

<!-- Overlay -->
<div id="overlay" class="overlay"></div>

<!-- Slide Drawer -->
<div id="sideDrawer" class="drawer">
    <h2>Eloria</h2>
    <button onclick="openSettings()">⚙ Settings</button>
    <button onclick="openHistory()">📜 History</button>
    <button onclick="openPrompts()">💬 Prompts</button>
    <button onclick="openMemory()">🧠 Memory</button>
</div>
</body>
</html>
