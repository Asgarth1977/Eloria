<!-- Index.html file -->

<!DOCTYPE html>
<html>
<head>
    <title>Eloria AI Assistant</title>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>

<!-- Startup Splash -->
<div id="startupSplash">
    <div id="splashContent">
        <div id="startupText"> Booting Eloria... </div>
        <div id="progressContainer">
            <div id="loadingProgress"></div>
        </div>
    </div>
    <!-- Animated background dots -->
    <canvas id="splashCanvas"></canvas>
</div>


    <div id="chat"></div>

    <!-- Input area -->
    <input type="file" id="attach-input" style="display:none;" accept=".json">
    <div id="input-area">
        <button id="attach-btn" title="Attach memory file">
            <img src="{{ url_for('static', filename='icons/plus_2795.png') }}" alt="+">
        </button>
        <div id="input" contenteditable="true" placeholder="Type a message..."></div>
        <button id="send">Send</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const chat = document.getElementById('chat');
            const input = document.getElementById('input');
            const sendBtn = document.getElementById('send');

        function addMessage(text, sender, timestamp){
            const div = document.createElement('div');
            div.className = 'bubble ' + sender;
            div.textContent = text;

            const ts = document.createElement('div');
            ts.className = 'timestamp';
            ts.textContent = timestamp;

            div.appendChild(ts);
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function getInputText() {
            return input.innerText;
        }

        async function sendMessage(){
            const text = getInputText().trim();
            if(!text) return;

            const now = new Date().toLocaleTimeString();
            addMessage(text, 'user', now);
            input.innerHTML = '';

            const res = await fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type':'application/json' },
                body: JSON.stringify({ text })
            });

            const data = await res.json();
            addMessage(data.response, 'ai', new Date().toLocaleTimeString());
        }

        sendBtn.addEventListener('click', sendMessage);

        input.addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                e.preventDefault(); // prevent newline
                sendMessage();
            }
        });

        // Load conversation history from Flask
        const conversation = {{ conversation | default([]) | tojson | safe }};
            for (const msg of conversation) {
            const sender = msg.role === 'user' ? 'user' : 'ai';
            addMessage(msg.content, sender, new Date(msg.timestamp).toLocaleTimeString());
        }
    });
</script>

    <!-- Menu Button -->
<button id="menuToggle" class="menu-btn">☰</button>

<!-- Overlay -->
<div id="overlay" class="overlay"></div>

<!-- Slide Drawer -->
<div id="sideDrawer" class="drawer">
    <h2>Eloria</h2>
    <button onclick="openSettings()">⚙ Settings</button>
    <button onclick="openHistory()">📜 History</button>
    <button onclick="openPrompts()">💬 Prompts</button>
    <button onclick="openMemory()">🧠 Memory</button>
</div>
</body>
</html>
