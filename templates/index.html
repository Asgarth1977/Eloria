<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eloria AI Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <script defer src="{{ url_for('static', filename='js/app.js') }}"></script>
    <script defer src="{{ url_for('static', filename='js/memory.js') }}"></script>
</head>
<body>
    <div id="startupSplash" aria-hidden="true">
        <div id="splashContent">
            <div id="startupText">Booting Eloria...</div>
            <div id="progressContainer">
                <div id="loadingProgress"></div>
            </div>
        </div>
        <canvas id="splashCanvas"></canvas>
    </div>

    <div id="app" class="app-shell" style="display:none;">
        <aside class="sidebar" id="sideDrawer">
            <div class="sidebar-header">
                <button id="newChatBtn" class="new-chat-btn">＋ New chat</button>
            </div>

            <div class="sidebar-section">
                <button id="menu-history" class="sidebar-btn">📜 History</button>
                <div id="panel-history" class="menu-panel">
                    <button id="load3Days">📅 Load Last 3 Days</button>
                    <button id="summarizeNow">📝 Summarize Conversation</button>
                    <button id="attach-btn">📎 Inject Memory JSON</button>
                    <input type="file" id="attach-input" style="display:none;" accept=".json">
                </div>
            </div>

            <div class="sidebar-section">
                <button id="menu-settings" class="sidebar-btn">⚙ Settings</button>
                <div id="panel-settings" class="menu-panel">
                    <label class="toggle-row" for="darkModeToggle">
                        <span>Dark Mode</span>
                        <input type="checkbox" id="darkModeToggle" checked>
                    </label>
                </div>
            </div>
        </aside>

        <main class="main-pane">
            <header class="topbar">
                <button id="menuToggle" class="menu-toggle" aria-label="Toggle sidebar">☰</button>
                <h1>Eloria</h1>
            </header>

            <section id="chat" class="chat-scroll"></section>

            <footer class="composer-wrap">
                <div class="composer-inner">
                    <div id="input" contenteditable="true" class="composer" placeholder="Message Eloria..."></div>
                    <button id="send" class="send-btn">Send</button>
                </div>
            </footer>
        </main>
    </div>

    <script id="conversationData" type="application/json">{{ conversation | default([]) | tojson | safe }}</script>
</body>
</html>
